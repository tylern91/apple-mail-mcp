[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0"
rust-version = "1.88"
license = "MIT"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# dist profile: maximally optimized + stripped for release binaries.
# Usage: cargo build --profile dist -p amx-cli
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
