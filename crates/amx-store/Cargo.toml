[package]
name = "amx-store"
version.workspace = true
rust-version.workspace = true
license.workspace = true
edition = "2024"
publish = false
description = "Read access to Apple Mail's SQLite Envelope Index and on-disk mailbox layout"
repository = "https://github.com/tylern91/apple-mail-mcp"

[lints]
workspace = true

[dependencies]
amx-core = { path = "../amx-core", features = ["sqlite"] }
percent-encoding = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
notify = "8"
notify-debouncer-mini = "0.7"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
