[package]
name = "amx-core"
version.workspace = true
rust-version.workspace = true
license.workspace = true
edition = "2024"
publish = false
description = "Shared types, config, and error definitions for apple-mail-mcp"
repository = "https://github.com/tylern91/apple-mail-mcp"

[lints]
workspace = true

[features]
default = []
sqlite = ["dep:rusqlite"]
tantivy = ["dep:tantivy"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-normalization = "0.1"
percent-encoding = "2"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
tantivy = { version = "0.26", optional = true }
