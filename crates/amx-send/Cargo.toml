[package]
name = "amx-send"
version.workspace = true
rust-version.workspace = true
license.workspace = true
edition = "2024"
publish = false
description = "SMTP delivery of composed messages"
repository = "https://github.com/tylern91/apple-mail-mcp"

[lints]
workspace = true

[dependencies]
amx-core = { path = "../amx-core" }
amx-compose = { path = "../amx-compose" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "form", "native-tls"] }
rand = "0.10.2"
sha2 = "0.11.0"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
keyring = "4.2.0"
