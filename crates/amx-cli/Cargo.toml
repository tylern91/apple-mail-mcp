[package]
name = "amx-cli"
version.workspace = true
rust-version.workspace = true
license.workspace = true
edition = "2024"
publish = false
description = "CLI entry point (amxcli) for apple-mail-mcp"
repository = "https://github.com/tylern91/apple-mail-mcp"

[lints]
workspace = true

[[bin]]
name = "amxcli"
path = "src/main.rs"

[dependencies]
amx-core = { path = "../amx-core" }
amx-index = { path = "../amx-index" }
amx-mcp = { path = "../amx-mcp" }
amx-parse = { path = "../amx-parse" }
amx-store = { path = "../amx-store" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
