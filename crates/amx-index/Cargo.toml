[package]
name = "amx-index"
version.workspace = true
rust-version.workspace = true
license.workspace = true
edition = "2024"
publish = false
description = "Tantivy-backed full-text index over parsed mail content"
repository = "https://github.com/tylern91/apple-mail-mcp"

[lints]
workspace = true

[dependencies]
amx-core = { path = "../amx-core", features = ["tantivy", "sqlite"] }
amx-parse = { path = "../amx-parse" }
amx-store = { path = "../amx-store" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tantivy = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
notify = "8"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
