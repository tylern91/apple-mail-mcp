[package]
name = "amx-automation"
version.workspace = true
rust-version.workspace = true
license.workspace = true
edition = "2024"
publish = false
description = "Mail.app automation for mutating operations (move, flag, delete)"
repository = "https://github.com/tylern91/apple-mail-mcp"

[lints]
workspace = true

[dependencies]
amx-core = { path = "../amx-core" }
amx-store = { path = "../amx-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
