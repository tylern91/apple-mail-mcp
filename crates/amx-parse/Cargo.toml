[package]
name = "amx-parse"
version.workspace = true
rust-version.workspace = true
license.workspace = true
edition = "2024"
publish = false
description = "Parsing of .emlx message files into structured MIME data"
repository = "https://github.com/tylern91/apple-mail-mcp"

[lints]
workspace = true

[dependencies]
amx-core = { path = "../amx-core" }
mail-parser = "0.11"
plist = "1"
serde = { version = "1", features = ["derive"] }
html5ever = "0.39"
markup5ever_rcdom = "0.39"
lopdf = "0.42"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
