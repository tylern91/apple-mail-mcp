[package]
name = "amx-mcp"
version.workspace = true
rust-version.workspace = true
license.workspace = true
edition = "2024"
publish = false
description = "MCP protocol server exposing Apple Mail read/mutate/send tools"
repository = "https://github.com/tylern91/apple-mail-mcp"

[lints]
workspace = true

[dependencies]
amx-automation = { path = "../amx-automation" }
amx-core = { path = "../amx-core" }
amx-index = { path = "../amx-index" }
amx-parse = { path = "../amx-parse" }
amx-store = { path = "../amx-store" }
axum = "0.8"
base64 = "0.22"
rmcp = { version = "3.3", features = ["server", "macros", "transport-io", "transport-async-rw", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tantivy = "0.26"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.6", features = ["auth"] }

[dev-dependencies]
tempfile = "3"
unicode-normalization = "0.1"
