# cargo-deny configuration — licence gate for apple-mail-mcp.
#
# This project is MIT-licensed and must not depend on GPL-family code (see
# umbrella spec §1.4). rqmd, the sibling template repo, has no equivalent
# cargo-deny setup — this is authored fresh for apple-mail-mcp.
#
# Usage: cargo deny check licenses

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # foldhash (transitive via rusqlite -> sqlite-wasm-rs -> hashbrown): permissive,
  # OSI-approved, not GPL-family — no conflict with §1.4's copyleft boundary.
  "Zlib",
  # notify (task 8, FSEvents watcher): public-domain-equivalent, permissive,
  # not GPL-family — no conflict with §1.4's copyleft boundary.
  "CC0-1.0",
  # quoted_printable (transitive via lettre, Phase 5 task 4 SMTP submission): a
  # public-domain-equivalent permissive license, strictly less restrictive than the
  # BSD variants already allowed — no conflict with §1.4's copyleft boundary.
  "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[advisories]
ignore = [
  # ttf-parser (transitive via lopdf, for embedded-font metrics): author declared it
  # unmaintained with no safe upgrade and no drop-in replacement lopdf has adopted yet
  # (harfbuzz/ttf-parser#217). Not a CVE — re-check when lopdf migrates to `skrifa`.
  "RUSTSEC-2026-0192",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
